name: Arc V2 PR checks

on:
  pull_request:
    branches: [product/v2]

concurrency:
  group: arc-v2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --workers=4
